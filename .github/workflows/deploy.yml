name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Pages REST API is not reachable by the Actions token on this account
# (configure-pages@v5 returns "Resource not accessible by integration"), so this
# publishes the built site to the gh-pages branch instead, which only needs
# contents: write. GitHub serves that branch at
# https://<owner>.github.io/pipeline-flux/ which is what vite's base is set to.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Prepare artifact for Pages
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          ls -la dist

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Published ${GITHUB_SHA} to gh-pages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/pipeline-flux/" >> $GITHUB_STEP_SUMMARY
